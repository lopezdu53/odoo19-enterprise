plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvcalendar.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvcalendar.kiosk'
        minSdk 21
        targetSdk 34
        versionCode 7
        versionName '1.6'
    }

    signingConfigs {
        // Clave fija para que TODAS las compilaciones tengan la misma firma
        // y las actualizaciones dentro de la app no den "conflicto de paquete".
        kiosk {
            storeFile file('../keystore/tvkiosk.jks')
            storePassword 'tvkiosk'
            keyAlias 'tvkiosk'
            keyPassword 'tvkiosk'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.kiosk
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.kiosk
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
