plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tvcalendar.kiosk'
    compileSdk 34

    defaultConfig {
        applicationId 'com.tvcalendar.kiosk'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
